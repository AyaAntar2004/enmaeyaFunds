// Same macro-figure exclusion as index.html's charts: flash appeals and
// "since 20XX" cumulative totals get re-reported across many articles, so
// summing every mention would double-count the same money repeatedly.
function isMacroFigure(p) {
  return /flash appeal|response plan/i.test(p.project) || /since 20\d\d/i.test(p.project + " " + p.amountRaw);
}

function summarizeSector(sectorId, allProjects) {
  const ps = allProjects.filter(function (p) { return p.sector === sectorId; });
  if (!ps.length) return "Data coming soon.";

  const totalM = ps.reduce(function (sum, p) { return sum + (isMacroFigure(p) || !p.amountUSDm ? 0 : p.amountUSDm); }, 0);
  const ministries = Array.from(new Set(ps.map(function (p) { return p.ministry; })));

  const regionCounts = {};
  ps.forEach(function (p) { if (p.region !== "National") regionCounts[p.region] = (regionCounts[p.region] || 0) + 1; });
  const topRegion = Object.keys(regionCounts).sort(function (a, b) { return regionCounts[b] - regionCounts[a]; })[0];

  const partnerCounts = {};
  ps.forEach(function (p) { p.partners.forEach(function (prt) { partnerCounts[prt] = (partnerCounts[prt] || 0) + 1; }); });
  const topPartner = Object.keys(partnerCounts).sort(function (a, b) { return partnerCounts[b] - partnerCounts[a]; })[0];

  let s = ps.length + " tracked funding record" + (ps.length === 1 ? "" : "s") +
    (ministries.length > 1 ? " across " + ministries.length + " ministries" : " under " + ministries[0]) + ".";
  if (totalM > 0) s += " Reported funding totals roughly $" + Math.round(totalM) + "M (excluding recurring appeals).";
  if (topRegion) s += " " + topRegion + " sees the most activity.";
  if (topPartner) s += " " + topPartner + " is the most frequent implementing partner.";
  return s;
}

function buildTree(data) {
  const sectors = data.sectorFilters.filter(function (s) { return s.id !== "all"; });
  const lastRecord = data.meta.lastRecord;
  const projects = data.ministryProjects || [];

  return {
    id: "root", label: "Funding Overview", sub: "",
    report: R("Lebanon Funding Network", "enmaeya", lastRecord, undefined,
      "Explore Lebanon’s development funding landscape through an interactive network of six key sectors. Select a sector to discover its main areas of focus, explore related funding information, and access Enmaeya’s latest news and resources."),
    children: sectors.map(function (s) {
      const label = LABEL_OVERRIDE[s.id] || s.label;
      const subtopics = SUBTOPICS[s.id] || [];
      const subtopicArticles = SUBTOPIC_ARTICLES[s.id] || {};
      const subtopicResources = SUBTOPIC_RESOURCES[s.id] || {};
      const subtopicStudio = SUBTOPIC_STUDIO[s.id] || {};

      // Only real, ID-specific enmaeya links are ever shown as cards, a
      // subtopic with no curated article/resource/interview just leaves that
      // carousel empty (hidden) rather than falling back to a generic,
      // non-specific link like enmaeya.com/en/news.
      const subtopicNodes = subtopics.map(function (word, i) {
        const arts = subtopicArticles[word];
        const articleReports = arts
          ? arts.map(function (a) { return R(a.title, "enmaeya", lastRecord, a.url, a.blurb || (word + " coverage from enmaeya."), a.img); })
          : [];
        const res = subtopicResources[word];
        const resourceReports = res
          ? res.map(function (r) { return R(r.title, "enmaeya Hub", lastRecord, r.url, r.blurb || (word + " resource from enmaeya Hub."), r.img); })
          : [];
        const stu = subtopicStudio[word];
        const studioReports = stu
          ? stu.map(function (r) { return R(r.title, "enmaeya Studio", lastRecord, r.url, r.blurb || (word + " interview from enmaeya Studio."), r.img); })
          : [];
        return {
          id: s.id + "-sub" + i, label: word, value: 17, hot: false,
          articles: articleReports,
          resources: resourceReports,
          studio: studioReports,
          report: articleReports[0] || R(label + ", " + word, "enmaeya", lastRecord, undefined, word + " is a tracked subtopic within " + label + ".")
        };
      });

      return {
        id: s.id, label: label, color: s.color,
        report: R(label, "enmaeya", lastRecord, undefined, summarizeSector(s.id, projects)),
        children: subtopicNodes
      };
    })
  };
}

const W=820,H=780,cx=410,cy=390,Rc=112,Ri=180,Ro=290;
const svg=d3.select("#map");
const sizeScale=d3.scaleSqrt().domain([0,60]).range([5,15]);
const dur=600, ease=d3.easeCubicInOut;
function polar(r,a){return [cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function sectorColorOf(node){var p=node;while(p&&!p.color){p=PARENT[p.id];}return (p&&p.color)||"#3b6ea5";}
function linkPath(d){
  var mx=(d.o._x+d.s._x)/2, my=(d.o._y+d.s._y)/2;
  var kx=cx+(mx-cx)*0.35, ky=cy+(my-cy)*0.35;
  return "M"+d.o._x+","+d.o._y+" Q"+kx+","+ky+" "+d.s._x+","+d.s._y;
}

// Inner ring only, always all 6 sectors, evenly spaced regardless of which
// are open. The outer ring (each open sector's own subtopic words) is laid
// out separately, and dynamically, by layoutOuterPositions() below.
function layoutPositions(sectors){
  const gap=0.06, per=(2*Math.PI-sectors.length*gap)/sectors.length;
  let ang=-Math.PI/2+gap/2+per/2;
  sectors.forEach(function(s){
    s._a=ang;
    const q=polar(Ri,ang); s._x=q[0]; s._y=q[1];
    ang+=per+gap;
  });
}

// Recomputed every time a sector opens or closes: each open sector's words
// fan out from its own fixed hub angle (never relocated), but the WIDTH of
// that fan grows the fewer sectors are open, one sector alone gets to
// spread its words across a wide, roomy arc; with several open at once each
// one's fan narrows back down, capped so neighboring fans can never cross.
function layoutOuterPositions(open){
  const maxArc = 100 * Math.PI / 180;
  const TAU = 2 * Math.PI;
  // Each open sector's fan is capped by how close its nearest OPEN
  // neighbor actually is on the ring (always 60deg apart, whether or not
  // the sectors between them are open), not just by how many sectors are
  // open in total. Two adjacent open sectors get narrow fans that can't
  // cross; two open sectors on opposite sides of the hub still get to
  // spread wide, however many others are open elsewhere.
  open.forEach(function(s){
    let minGap = TAU;
    open.forEach(function(o){
      if (o === s) return;
      let d = Math.abs(s._a - o._a) % TAU;
      if (d > Math.PI) d = TAU - d;
      if (d < minGap) minGap = d;
    });
    const arc = open.length > 1 ? Math.min(maxArc, minGap * 0.8) : maxArc;
    const per = arc / s.children.length;
    const start = s._a - arc / 2 + per / 2;
    s.children.forEach(function(c,i){
      const a = start + i * per;
      c._a = a;
      const p = polar(Ro, a); c._x = p[0]; c._y = p[1];
    });
  });
}

function leafLabelAttrs(d){
  var flip=Math.cos(d._a)<0, deg=d._a*180/Math.PI, lr=Ro+sizeScale(d.value||10)+7, p=polar(lr,d._a);
  return { transform:"translate("+p[0]+","+p[1]+") rotate("+(flip?deg+180:deg)+")", anchor: flip?"end":"start" };
}

function openList(){
  return TREE.children.filter(function(s){ return openSectors.has(s.id); });
}

function updateCrumbBack(){
  const backEl=document.getElementById("back");
  const crumbEl=document.getElementById("crumb");
  const open=openList();
  if(open.length){
    crumbEl.textContent=open.map(function(s){return s.label;}).join(", ");
    backEl.innerHTML="&#8592; Overview";
    backEl.onclick=function(){ closeAll(); };
  } else {
    crumbEl.textContent="Overview";
    backEl.innerHTML="&#8592; Dashboard";
    backEl.onclick=function(){ window.location.href="index"; };
  }
  backEl.style.visibility="visible";
}

function refreshSelection(){
  svg.select(".inner-layer").selectAll("g.node circle")
    .attr("fill",function(d){return openSectors.has(d.id)?d.color:"#fff";})
    .attr("stroke",function(d){return openSectors.has(d.id)?d.color:d.color;});
  if(outerLayer){
    outerLayer.selectAll("g.node circle")
      .attr("fill",function(d){return d.id===selectedId?sectorColorOf(d):"#fff";})
      .attr("stroke",function(d){return d.id===selectedId?sectorColorOf(d):"#9aa8b4";});
  }
}

function toggleSector(sec){
  if(openSectors.has(sec.id)){
    openSectors.delete(sec.id);
  } else {
    openSectors.add(sec.id);
  }
  selectedId=sec.id;
  setPanel(sec);
  buildList();
  buildResourceList();
  buildStudioList();
  refreshSelection();
  updateCrumbBack();
  animateOuter();
}

function closeAll(){
  openSectors.clear();
  selectedId=null;
  setPanel(TREE);
  buildList();
  buildResourceList();
  buildStudioList();
  refreshSelection();
  updateCrumbBack();
  animateOuter();
}

function parentPos(leaf){
  var p=PARENT[leaf.id];
  return p ? [p._x,p._y] : [cx,cy];
}
function collapsedLinkPath(d){
  return "M"+d.s._x+","+d.s._y+" Q"+d.s._x+","+d.s._y+" "+d.s._x+","+d.s._y;
}

function animateOuter(){
  const open = openList();
  layoutOuterPositions(open);
  const leaves = open.reduce(function(acc,s){return acc.concat(s.children);},[]);
  const linkData = open.reduce(function(acc,s){return acc.concat(s.children.map(function(c){return {o:c,s:s};}));},[]);
  const ringColor = open.length===1 ? open[0].color : "#3b6ea5";
  const popEase = d3.easeBackOut.overshoot(1.8);

  svg.select(".hubring")
    .transition().duration(140).ease(d3.easeCubicOut).attr("r",Rc+20)
    .transition().duration(dur).ease(d3.easeElasticOut.amplitude(1).period(0.35)).attr("r",Rc+15);
  svg.select(".hubring").transition().duration(dur).ease(ease)
    .attr("stroke", ringColor).attr("opacity", open.length?0.9:0.7);

  // LINKS, grow from a zero-length stub at the parent sector out to the leaf,
  // each one staggered so they fan out in sequence rather than all at once.
  const linkSel=linkLayer.selectAll("path.link").data(linkData, function(d){return d.o.id;});
  linkSel.exit()
    .transition().delay(function(d,i){return i*18;}).duration(dur*0.5).ease(d3.easeCubicIn)
    .attr("d",collapsedLinkPath).style("opacity",0)
    .remove();
  const linkEnter=linkSel.enter().append("path").attr("class","link")
    .style("opacity",0).attr("d",collapsedLinkPath);
  linkEnter.transition().delay(function(d,i){return i*45;}).duration(dur).ease(d3.easeCubicInOut)
    .attr("d",linkPath).style("opacity",.5);
  // Links for sectors that were already open reflow to their new arc width too
  // (opening/closing a neighbor changes everyone else's fan), not just new ones.
  linkSel.transition().duration(dur).ease(ease).attr("d",linkPath);

  // NODES, pop outward from the parent's position with a springy overshoot,
  // staggered per node for a cascading "bloom" effect.
  const nodeSel=outerLayer.selectAll("g.node").data(leaves, function(d){return d.id;});

  nodeSel.exit().each(function(d){
    var pp=parentPos(d);
    var g=d3.select(this);
    g.select("circle").transition().duration(dur*0.4).ease(d3.easeCubicIn)
      .attr("cx",pp[0]).attr("cy",pp[1]).attr("r",0);
    g.select("text").transition().duration(dur*0.25).style("opacity",0);
    g.transition().delay(dur*0.4).duration(1).remove();
  });

  const nodeEnter=nodeSel.enter().append("g").attr("class","node");
  nodeEnter.append("circle")
    .attr("cx",function(d){return parentPos(d)[0];}).attr("cy",function(d){return parentPos(d)[1];})
    .attr("r",0)
    .attr("fill",function(d){return d.id===selectedId?sectorColorOf(d):"#fff";})
    .attr("stroke",function(d){return d.id===selectedId?sectorColorOf(d):"#9aa8b4";}).attr("stroke-width",1.4)
    .on("click",function(e,d){ e.stopPropagation(); selectedId=d.id; setPanel(d); refreshSelection(); buildList(); buildResourceList(); buildStudioList(); });
  nodeEnter.append("text").attr("class","olabel").style("opacity",0).each(function(d){
    var a=leafLabelAttrs(d);
    d3.select(this).attr("transform",a.transform).attr("text-anchor",a.anchor).attr("dy","0.32em").text(d.label);
  });

  nodeEnter.select("circle")
    .transition().delay(function(d,i){return i*55;}).duration(dur).ease(popEase)
    .attr("cx",function(d){return d._x;}).attr("cy",function(d){return d._y;})
    .attr("r",function(d){return sizeScale(d.value||10);});
  nodeEnter.select("text")
    .transition().delay(function(d,i){return i*55+dur*0.35;}).duration(260).ease(d3.easeCubicOut)
    .style("opacity",1);

  // Words for sectors that were already open glide to their new spot in the
  // (possibly wider or narrower) fan too, instead of only ever moving on
  // their own sector's open/close, this is what keeps everything currently
  // on screen from ever overlapping, no matter what else opens or closes.
  nodeSel.select("circle").transition().duration(dur).ease(ease)
    .attr("cx",function(d){return d._x;}).attr("cy",function(d){return d._y;});
  nodeSel.select("text")
    .attr("text-anchor",function(d){return leafLabelAttrs(d).anchor;})
    .transition().duration(dur).ease(ease)
    .attr("transform",function(d){return leafLabelAttrs(d).transform;});
}

function drawHub(root){
  svg.append("circle").attr("class","hubring").attr("cx",cx).attr("cy",cy).attr("r",Rc+15).attr("fill","none").attr("stroke","#3b6ea5").attr("stroke-width",2).attr("opacity",.7);
  svg.append("circle").attr("cx",cx).attr("cy",cy).attr("r",Rc).attr("fill","url(#hg)").style("cursor","pointer")
    .on("click",function(){ closeAll(); });
  svg.append("text").attr("class","hublabel").attr("x",cx).attr("y",cy-2).attr("font-size",21).text("Funding");
  svg.append("text").attr("class","hublabel").attr("x",cx).attr("y",cy+22).attr("font-size",21).text("Overview");
}

function drawInner(sectors){
  const gg=svg.append("g").attr("class","inner-layer").selectAll("g").data(sectors).enter().append("g").attr("class","node");
  gg.append("circle").attr("cx",function(d){return d._x;}).attr("cy",function(d){return d._y;}).attr("r",18)
    .attr("fill",function(d){return openSectors.has(d.id)?d.color:"#fff";}).attr("stroke",function(d){return openSectors.has(d.id)?d.color:d.color;}).attr("stroke-width",3)
    .on("click",function(e,d){
      e.stopPropagation();
      d3.select(this).transition().duration(110).ease(d3.easeCubicOut).attr("r",23)
        .transition().duration(dur*0.6).ease(d3.easeElasticOut.amplitude(1).period(0.35)).attr("r",18);
      toggleSector(d);
    });
  // Always centered directly under the sector's own circle, not beside it
  // at the same ring angle, so every label sits in the same relative spot
  // no matter where around the hub that sector falls.
  gg.append("text").attr("class","slabel")
    .attr("x",function(d){var c=Math.cos(d._a);return d._x+(c>0.3?-24:c<-0.3?24:0);})
    .attr("y",function(d){return d._y+(Math.sin(d._a)<-0.3?40:34);})
    .attr("text-anchor",function(d){var c=Math.cos(d._a);return c>0.3?"start":c<-0.3?"end":"middle";})
    .attr("fill",function(d){return d.color;}).text(function(d){return d.label;});
}

function render(){
  svg.selectAll("*").remove();
  const defs=svg.append("defs");
  const g=defs.append("radialGradient").attr("id","hg");
  g.append("stop").attr("offset","0%").attr("stop-color","#40567a");
  g.append("stop").attr("offset","100%").attr("stop-color","#26344c");

  const sectors=TREE.children;
  layoutPositions(sectors);

  linkLayer=svg.append("g").attr("class","link-layer");
  drawHub(TREE);
  drawInner(sectors);
  outerLayer=svg.append("g").attr("class","outer-layer");

  openSectors=new Set(); selectedId=null;
  setPanel(TREE);
  buildList();
  buildResourceList();
  buildStudioList();
  updateCrumbBack();
}

function setPanel(node){
  var rep=node.report||node, color=node.color||sectorColorOf(node);
  d3.select("#phead").style("background","linear-gradient(135deg,#26344c,"+color+")");
  d3.select("#ptitle").text(rep.title);
  d3.select("#pmeta").html(rep.date?"<span class='tag'>"+(node.label||"Report")+"</span> "+rep.date:"");
  d3.select("#pbody").text(rep.blurb||"");
}

// Only real, ID-specific articles ever become cards, a subsector or sector
// with none just leaves the News carousel empty (hidden), same as the
// Resources/Studio carousels.
function buildList(){
  var open=openList();
  var items=[];
  var sel = selectedId && BYID[selectedId];
  var selIsLeaf = sel && PARENT[sel.id] && PARENT[sel.id] !== TREE;
  if(selIsLeaf){
    items = (sel.articles && sel.articles.length) ? sel.articles.map(function(rep){return {node:sel,rep:rep};}) : [];
  } else if(open.length){
    open.forEach(function(sec){
      sec.children.forEach(function(c){
        if(c.articles && c.articles.length){
          c.articles.forEach(function(rep){items.push({node:c,rep:rep});});
        }
      });
    });
  }
  var block = document.getElementById("newsBrowse");
  if(!items.length){ block.style.display="none"; d3.select("#plist").html(""); return; }
  block.style.display="";
  d3.select("#plist").html(items.map(cardHTML).join(""));
  refreshCarouselNav("plist","pPrev","pNext");
}

function cardHTML(it){
  var c=it.node.color||sectorColorOf(it.node);
  var img=it.rep.img ? "<img src='"+it.rep.img+"' alt='' loading='lazy' onerror=\"this.remove()\">" : "";
  var bg=it.rep.img ? "" : " style='background:"+c+"'";
  return "<a class='card' href='"+it.rep.url+"' target='_blank' rel='noopener'"+bg+">"+img+
    "<span class='src'>"+it.rep.src+"</span>"+
    "<span class='overlay'>"+it.rep.title+"</span></a>";
}

// Resources and Studio carousels both mirror the News one: a selected
// subsector shows its own items, and a selected sector (no subsector picked)
// shows every item pooled from all of that sector's subsectors. Each is
// hidden entirely when the current selection has nothing for that field.
function buildFieldList(field, blockId, listId, prevId, nextId){
  var open=openList();
  var sel = selectedId && BYID[selectedId];
  var selIsLeaf = sel && PARENT[sel.id] && PARENT[sel.id] !== TREE;
  var items=[];
  if(selIsLeaf){
    items = (sel[field] && sel[field].length) ? sel[field].map(function(rep){return {node:sel,rep:rep};}) : [];
  } else if(open.length){
    open.forEach(function(sec){
      sec.children.forEach(function(c){
        if(c[field] && c[field].length){
          c[field].forEach(function(rep){items.push({node:c,rep:rep});});
        }
      });
    });
  }
  var block = document.getElementById(blockId);
  if(!items.length){ block.style.display="none"; d3.select("#"+listId).html(""); return; }
  block.style.display="";
  d3.select("#"+listId).html(items.map(cardHTML).join(""));
  refreshCarouselNav(listId,prevId,nextId);
}
function buildResourceList(){ buildFieldList("resources","resourcesBrowse","rlist","rPrev","rNext"); }
function buildStudioList(){ buildFieldList("studio","studioBrowse","slist","sPrev","sNext"); }

function refreshCarouselNav(listId,prevId,nextId){
  var list=document.getElementById(listId), prev=document.getElementById(prevId), next=document.getElementById(nextId);
  var overflow = list.scrollWidth > list.clientWidth+2;
  prev.classList.toggle("hide", !overflow);
  next.classList.toggle("hide", !overflow);
  prev.disabled = list.scrollLeft<=2;
  next.disabled = list.scrollLeft + list.clientWidth >= list.scrollWidth-2;
}

function wireCarousel(listId,prevId,nextId){
  var list=document.getElementById(listId), prev=document.getElementById(prevId), next=document.getElementById(nextId);
  prev.onclick=function(){ list.scrollBy({left:-list.clientWidth,behavior:"smooth"}); };
  next.onclick=function(){ list.scrollBy({left:list.clientWidth,behavior:"smooth"}); };
  list.onscroll=function(){ refreshCarouselNav(listId,prevId,nextId); };
}
wireCarousel("plist","pPrev","pNext");
wireCarousel("rlist","rPrev","rNext");
wireCarousel("slist","sPrev","sNext");

async function init(){
  const res = await fetch("data.json");
  const data = await res.json();

  TREE = buildTree(data);
  BYID = {}; (function idx(n){BYID[n.id]=n;(n.children||[]).forEach(idx);})(TREE);
  PARENT = {}; (function par(n){(n.children||[]).forEach(function(c){PARENT[c.id]=n;par(c);});})(TREE);

  render();
}

init();
</script>
